<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Shopping Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="online_shop">
    <h1>Martin's Mall</h1>
    <p>Get the best tech from anywhere in the country</p>
  </header>

  <main class="product_page">
    <div class="product">
      <img src="https://placehold.co/300x200" class="product_image">
      <h2 class="product_name">Playstation 5</h2>
      <p class="product_price">R14 499</p>
      <button class="purchase">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://placehold.co/300x200" class="product_image">
      <h2 class="product_name">Raspberry Pi 5 (8GB RAM Model)</h2>
      <p class="product_price">R4 250</p>
      <button class="purchase">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://placehold.co/300x200" class="product_image">
      <h2 class="product_name">Optiplex 9020 (Refurbished)</h2>
      <p class="product_price">R7 649</p>
      <button class="purchase">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://placehold.co/300x200" class="product_image">
      <h2 class="product_name">NVIDIA GeForce RTX 3060Ti (8GB)</h2>
      <p class="product_price">R8 555</p>
      <button class="purchase">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://placehold.co/300x200" class="product_image">
      <h2 class="product_name">Nintendo Switch 2</h2>
      <p class="product_price">R10 999</p>
      <button class="purchase">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://placehold.co/300x200" class="product_image">
      <h2 class="product_name">27-Inch QHD Gaming Office Monitor</h2>
      <p class="product_price">R3 999</p>
      <button class="purchase">Add to Cart</button>
    </div>
  </main>

</body>
</html>
